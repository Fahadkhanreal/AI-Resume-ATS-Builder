<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />

  <!-- Document Body -->
  <g filter="url(#shadow)">
    <rect x="6.5" y="5.5" width="15" height="21" rx="2.5" fill="#0f172a" />
    <!-- Header title bar -->
    <rect x="9" y="8.5" width="7" height="2" rx="1" fill="#34d399" />
    <!-- Document content lines -->
    <rect x="9" y="12.5" width="10" height="1.5" rx="0.75" fill="#94a3b8" />
    <rect x="9" y="15.5" width="8" height="1.5" rx="0.75" fill="#94a3b8" />
    <rect x="9" y="18.5" width="10" height="1.5" rx="0.75" fill="#94a3b8" />
    <rect x="9" y="21.5" width="6" height="1.5" rx="0.75" fill="#64748b" />
  </g>

  <!-- AI Sparkle 4-point star -->
  <path d="M23.5 5.5 C23.5 8.2 24.8 9.5 27.5 9.5 C24.8 9.5 23.5 10.8 23.5 13.5 C23.5 10.8 22.2 9.5 19.5 9.5 C22.2 9.5 23.5 8.2 23.5 5.5 Z" fill="url(#starGrad)" />
  <circle cx="27" cy="5" r="0.8" fill="#fef08a" />
</svg>
